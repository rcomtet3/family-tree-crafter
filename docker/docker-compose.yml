version: '3.8'

services:
  person-service:
    build:
      context: ../services/person-service
      dockerfile: src/main/docker/Dockerfile
    image: family-tree/person-service:latest
    container_name: person-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_APPLICATION_NAME=person-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - family-tree-network

networks:
  family-tree-network:
    driver: bridge
